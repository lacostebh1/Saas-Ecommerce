name: Maintenance (4h)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/setup-robot-shop-EXNKt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        id: tc
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Playwright install
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e
        run: npm run test:e2e

      - name: Outdated dependencies report
        if: always()
        run: npm outdated || true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔧 Maintenance failure — ${new Date().toISOString().slice(0,10)}`;
            const body = `Le workflow de maintenance 4h a échoué. Voir le run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["maintenance", "automated"]
            });
